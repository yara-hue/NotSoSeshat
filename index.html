    <script>
      var actx;
      var bufPop, bufDing, bufBoo;
      var audioReady = false;

      function initAudio() {
        if (actx) return;
        actx = new (window.AudioContext || window.webkitAudioContext)();
        function load(url) {
          return fetch(url).then(function(r) { return r.arrayBuffer(); }).then(function(buf) { return actx.decodeAudioData(buf); });
        }
        Promise.all([
          load('assets/confetti-pop-sound.mp3').then(function(b) { bufPop = b; }),
          load('assets/confetti_1.mp3').then(function(b) { bufDing = b; }),
          load('assets/crowd-boo-sound-effect.mp3').then(function(b) { bufBoo = b; })
        ]).then(function() { audioReady = true; });
      }

      function ensureResumed() {
        if (actx && actx.state === 'suspended') actx.resume();
      }

      function playBuf(buf, vol) {
        if (!actx || !buf) return;
        ensureResumed();
        var src = actx.createBufferSource();
        src.buffer = buf;
        var g = actx.createGain();
        g.gain.value = vol || 0.4;
        src.connect(g);
        g.connect(actx.destination);
        src.start();
      }

      function playPop() {
        try {
          var a = new Audio('assets/confetti-pop-sound.mp3');
          a.volume = 0.5;
          a.play();
        } catch (e) {}
      }
      function playDing() { playBuf(bufDing, 0.4); }
      function playBoop() { playBuf(bufBoo, 0.4); }

      $(function() {
        initAudio();
        $.confetti.setLineMode();
        $.confetti.start();
        setTimeout(function() { $.confetti.stop(); }, 3000);
        /* confetti trigger moved to Mr. Green's explosion */
        document.addEventListener('click', function firstClick() {
          playPop();
          document.removeEventListener('click', firstClick);
        }, { once: true });
      });

      function showConfettiPrompt() {
        var overlay = document.createElement('div');
        overlay.id = 'confettiPrompt';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3);font-family:"Inter",system-ui,sans-serif;';
        overlay.innerHTML =
          '<div style="background:#fff;border-radius:20px;padding:32px 40px;max-width:400px;width:90%;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,0.25);">' +
            '<h2 style="font-size:22px;font-weight:700;color:#0f6a44;margin:0 0 8px;">🎉 would you like more confetti?</h2>' +
            '<p style="font-size:15px;color:#666;margin:0 0 24px;">the celebration is just getting started</p>' +
            '<div style="display:flex;gap:12px;justify-content:center;">' +
              '<button id="confettiYes" style="padding:12px 32px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;background:#0f6a44;color:#fff;transition:transform .15s;">yes!</button>' +
              '<button id="confettiNo" style="padding:12px 32px;border:2px solid #ddd;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;background:#fff;color:#999;transition:transform .15s;">no</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(overlay);

        document.getElementById('confettiYes').addEventListener('click', function() {
          confettiResponse(true);
        });
        document.getElementById('confettiNo').addEventListener('click', function() {
          confettiResponse(false);
        });
      }

      function confettiResponse(choice) {
        var overlay = document.getElementById('confettiPrompt');
        if (overlay) overlay.remove();

        if (choice) {
          playDing();
          $.confetti.setLineMode();
        } else {
          playBoop();
          $.confetti.setEmojiMode('\ud83c\udf45');
        }

        $.confetti.restart();
        toast(choice
          ? 'yaayy! more confetti for you'
          : 'booo, take this you miserable donut');

        setTimeout(function() { $.confetti.stop(); }, 4000);
      }

      function toast(msg) {
        var el = document.createElement('div');
        el.textContent = msg;
        el.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:99999;background:#1a1a1a;color:#fff;padding:14px 28px;border-radius:14px;font-family:"Inter",system-ui,sans-serif;font-size:16px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,0.3);opacity:0;transition:opacity .3s ease;pointer-events:none;';
        document.body.appendChild(el);
        requestAnimationFrame(function() { el.style.opacity = '1'; });
        setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }, 3000);
      }
    </script>

          fillBtn.addEventListener('mouseenter', function(){this.style.background='#e8f5ee';});

            var tInputs = modal.querySelectorAll('input[type="text"]:not([readonly])');
            var vals = ['Controlled', 'Stable', 'Ongoing', 'Monitored'];
            var vi = 0;
            for (var i = 0; i < tInputs.length; i++) {
              if (!tInputs[i].value || tInputs[i].value.trim() === '') {
                tInputs[i].value = vals[vi % vals.length];
                vi++;
                var ev = document.createEvent('HTMLEvents');
                ev.initEvent('change', true, false);
                tInputs[i].dispatchEvent(ev);
              }
            }
            var cbs = modal.querySelectorAll('input[type="checkbox"]:not(:checked)');
            for (var i = 0; i < Math.min(4, cbs.length); i++) {
              cbs[i].checked = true;

        }
        var inputs = modal.querySelectorAll('input[type="text"], input[type="number"], textarea, select');
        for (var i = 0; i < inputs.length; i++) {
          (function(inp) {
            function updateFill() {
              if (inp.value && inp.value.toString().trim() !== '') {

                'Start Exploring →' +

          var ctaNext = faqEl.nextSibling;

            parent.insertBefore(ctaStrip, ctaNext);

      function toggleFAQ(btn) {
        btn.classList.toggle('open');
        var answer = document.getElementById(btn.getAttribute('aria-controls'));
        if (!answer) return;
        var closed = !answer.classList.contains('open');
        btn.setAttribute('aria-expanded', !closed);
        answer.classList.toggle('open');

      function faqKeyNav(e, btn) {
        var items = document.querySelectorAll('.faq-question');
        var idx = Array.prototype.indexOf.call(items, btn);
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (idx < items.length - 1) items[idx + 1].focus();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (idx > 0) items[idx - 1].focus();
        } else if (e.key === 'Home') {
          e.preventDefault();
          items[0].focus();
        } else if (e.key === 'End') {
          e.preventDefault();
          items[items.length - 1].focus();
        }
      }

      var pageObserver = new MutationObserver(function() {

      setTimeout(function() {

    <!-- Mascot: green half-circle with mouse-following eyes -->

    <style>

      }

    <script>
      (function() {
        var mascot = document.getElementById('mascot');
        var body = mascot.querySelector('.mascot-body');
        var pupils = mascot.querySelectorAll('.pupil');
        var eyes = mascot.querySelectorAll('.eye');
        var progress = 0, timer = null, hover = false;

        var exploded = false;
        var avoidMode = false;
        var isHidden = false;
        var explosionCount = 0;
        var isLeaving = false;
        var hoveringNav = false;
        var HIDE_PX = 40;
        var AVOID_DIST = 180;
        var RAGE_TICK = 0.011;

        function moveEyes(e) {
          var sd = hoveringNav ? 1.61 : 1;
          if (hover) {
            pupils.forEach(function(p) {
              p.style.transform = 'translate(0px,0px) scale(' + sd + ')';
            });
          } else {
            var rect = mascot.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            var dx = e.clientX - cx;
            var dy = e.clientY - cy;
            var angle = Math.atan2(dy, dx);
            var maxDist = 6;
            var x = Math.cos(angle) * maxDist;
            var y = Math.sin(angle) * maxDist;
            pupils.forEach(function(p) {
              p.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + sd + ')';
            });
          }

          if (!hover && avoidMode) {
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < AVOID_DIST && !isHidden) {
              isHidden = true;
              mascot.style.transform = 'translateY(' + HIDE_PX + 'px)';
            } else if (dist >= AVOID_DIST + 50 && isHidden) {
              isHidden = false;
              mascot.style.transform = '';
            }
          }
        }

        function startRage() {
          if (isLeaving) return;
          if (exploded && !avoidMode) return;
          hover = true;
          progress = 0;
          if (timer) clearInterval(timer);
          timer = setInterval(function() {
            if (!hover) return;
            progress += RAGE_TICK;
            if (progress >= 1) {
              clearInterval(timer);
              timer = null;
              var wasFirst = !exploded;
              explode();
              if (!wasFirst && hover && avoidMode) {
                startRage();
              }
              return;
            }
            var p = progress;
            var r = Math.round(15 + 185 * p);
            var g = Math.round(106 - 106 * p);
            var b = Math.round(68 - 68 * p);
            body.style.background = 'rgb(' + r + ',' + g + ',' + b + ')';
            var intensity = p * 8;
            var sx = (Math.random() - 0.5) * intensity * 2;
            var sy = (Math.random() - 0.5) * intensity * 2;
            var baseTransform = isHidden ? 'translateY(' + HIDE_PX + 'px) ' : '';
            mascot.style.transform = baseTransform + 'scale(' + (1 + p * 0.15) + ') translate(' + sx + 'px,' + sy + 'px)';
          }, 50);
        }

        function stopRage() {
          hover = false;
          if (timer) { clearInterval(timer); timer = null; }
          body.style.background = '#0f6a44';
          mascot.style.transform = isHidden ? 'translateY(' + HIDE_PX + 'px)' : '';
          progress = 0;
        }

        function walkAway() {
          isLeaving = true;
          mascot.removeEventListener('mouseenter', startRage);
          mascot.removeEventListener('mouseleave', stopRage);
          document.removeEventListener('mousemove', moveEyes);

          pupils.forEach(function(p) {
            p.style.transition = 'none';
            p.style.transform = 'translate(12px, 0px)';
          });

          mascot.style.pointerEvents = 'none';
          mascot.style.transition = 'transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
          mascot.style.transform = 'translateY(-60px)';

          setTimeout(function() {
            mascot.style.transition = 'none';
            var frame = 0, totalFrames = 170;
            var walkTimer = setInterval(function() {
              frame++;
              var t = Math.min(frame / totalFrames, 1);
              var eased = 1 - Math.pow(1 - t, 3);
              var x = eased * 500;
              var bob = Math.sin(frame * 0.18) * 3;
              mascot.style.transform = 'translateY(-60px) translateX(' + x + 'px) translateY(' + bob + 'px)';
              mascot.style.opacity = 1 - t;
              if (t >= 1) {
                clearInterval(walkTimer);
                mascot.style.display = 'none';
              }
            }, 16);
          }, 500);
        }

        function explode() {
          if (typeof $ !== 'undefined' && $.confetti) {
            $.confetti.restart();
            setTimeout(function() { $.confetti.stop(); }, 2000);
          }
          body.style.background = '#0f6a44';
          progress = 0;
          explosionCount++;

          if (explosionCount >= 2) {
            isLeaving = true;
            hover = false;
            if (timer) { clearInterval(timer); timer = null; }
            mascot.style.transform = isHidden ? 'translateY(' + HIDE_PX + 'px)' : '';
            setTimeout(walkAway, 600);
            return;
          }

          if (!exploded) {
            exploded = true;
            mascot.style.transform = '';
            isHidden = false;
            setTimeout(function() {
              isHidden = true;
              mascot.style.transform = 'translateY(' + HIDE_PX + 'px)';
            }, 400);
            setTimeout(function() {
              isHidden = false;
              mascot.style.transform = '';
              avoidMode = true;
            }, 3400);
          } else {
            avoidMode = true;
            if (isHidden) {
              mascot.style.transform = 'translateY(' + HIDE_PX + 'px)';
            } else {
              mascot.style.transform = '';
            }
          }
        }

        (function() {
          var pollNav = setInterval(function() {
            var nav = document.querySelector('header.fixed.top-0');
            if (nav) {
              clearInterval(pollNav);
              var md = document.querySelector('.mouth-dot');
              nav.addEventListener('mouseenter', function() {
                hoveringNav = true;
                if (md) md.classList.add('active');
              });
              nav.addEventListener('mouseleave', function() {
                hoveringNav = false;
                if (md) md.classList.remove('active');
              });
            }
          }, 200);
        })();
        mascot.addEventListener('mouseenter', startRage);
        mascot.addEventListener('mouseleave', stopRage);
        document.addEventListener('mousemove', moveEyes);
      })();
    </script>
</body>
</html>
